name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0c63e7&color_dots=#ebedf0,#b9dcfb,#6cb6f5,#0a85ed,#0c63e7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#0a85ed&color_dots=#1c1d20,#0b3a66,#0c63e7,#0a85ed,#6cb6f5&color_background=#0a0a0a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
